  <div id="app">
    <div id="bg"></div>
    <div id="lyrics"></div>
    <div id="loading">\u6b4c\u8bcd\u52a0\u8f7d\u4e2d\u2026</div>

<style id="wellmusic-css">
/* ---- WellMusic 注入：背景层控制 ----
   #bg 是独立全屏层（z-index:0），歌词在 #lyrics（z-index:1）。
   高斯模糊只作用在 #bg 上，歌词层完全不受影响 —— 这是能做到
   「背景模糊 + 歌词清晰」且性能可控的关键。

   用 blur 而不是叠加一张预模糊贴图，是因为 #bg 内容每帧都在变；
   交给 GPU 合成器做卷积比在 JS 里多跑一遍离屏渲染更划算。 */
#bg {
  will-change: transform, opacity;
  transition: opacity .35s ease, filter .35s ease;
  /* 升到独立合成层：让 blur 只在这一层发生，避免牵连祖先的重绘 */
  transform: translateZ(0);
  /* --wm-bg-blur / --wm-bg-saturate / --wm-bg-opacity 由桥接层写入 */
  filter: blur(var(--wm-bg-blur, 0px)) saturate(var(--wm-bg-saturate, 1));
  opacity: var(--wm-bg-opacity, 1);
}
/* 静态 / 关闭：彻底跳过该子树的绘制与合成，最省电 */
#bg.wm-bg-hidden {
  display: none !important;
  filter: none !important;
}
/* 歌词层保持清晰，叠一层很淡的投影让文字在亮背景上也稳 */
#lyrics {
  text-shadow: 0 1px 12px rgba(0, 0, 0, .35);
}
</style>

  Function.prototype.bind = function () {
    var target = this;
    var self = arguments.length ? arguments[0] : undefined;
    // 只认渲染器：这几个方法同时存在才算，避免误伤任意 bind 调用
    if (self && typeof self === 'object' &&
        typeof self.onTick === 'function' &&
        typeof self.setRenderScale === 'function' &&
        typeof self.setFPS === 'function' &&
        typeof self.setStaticMode === 'function') {
      if (!renderer) renderer = self;
    }
    return origBind.apply(target, arguments);
  };
  // 还原：渲染器只在页面初始化时构造一次，取到就够。
  var restoreBind = window.setTimeout(function () {
    Function.prototype.bind = origBind;
  }, 3000);

  function getRenderer() {
    if (renderer) return renderer;
    // 兜底：万一 bind hook 没命中（官方改版），尝试从 #bg 的 canvas 上找。
    // 渲染器把 canvas 存在自身 element 上，反过来没有引用，所以这里
    // 只能拿到 canvas 本身，仅用于日志判断。
    return null;
  }

  // ==================================================================
  // 1. 内部状态
  // ==================================================================
  var bgMode = 'blurOnly';   // flowing | blurOnly | still | off
  var bgBlur = 28;           // 高斯模糊半径（px）
  var bgSaturate = 1.05;     // 饱和度增益（模糊后容易发灰，略微提一点）
  var bgOpacity = 0.72;      // 背景层不透明度
  var bgHidden = false;      // 是否彻底不渲染背景
  var bgFps = 40;            // 目标帧率（官方默认 40）
  var bgRenderScale = 0.5;   // 渲染分辨率倍率（官方默认 0.5）
  var bgFlowSpeed = 0.3;     // 流动速度（官方默认 0.3）
  var desiredPaused = false; // 静态模式希望暂停渲染器
  var currentAlbumId = null;
  var currentAlbumImage = null;
  var amll = null;

  function bgEl() { return document.getElementById('bg'); }
  function getAmll() {
    if (!amll && window.amll) amll = window.amll;
    return amll;
  }

  // ==================================================================
  // 2. 背景层 CSS
  // ==================================================================
  function applyBackgroundCss() {
    var el = bgEl();
    if (!el) return;
    el.style.setProperty('--wm-bg-blur', bgBlur + 'px');
    el.style.setProperty('--wm-bg-saturate', String(bgSaturate));
    el.style.setProperty('--wm-bg-opacity', String(bgOpacity));
    if (bgHidden) el.classList.add('wm-bg-hidden');
    else el.classList.remove('wm-bg-hidden');
  }

  // ==================================================================
  // 3. 渲染器性能档位（真正生效的那条路径）
  // ==================================================================
  function applyRendererTuning() {
    var r = getRenderer();
    if (!r) return false;
    try {
      if (typeof r.setFPS === 'function') r.setFPS(bgFps);
      if (typeof r.setRenderScale === 'function') r.setRenderScale(bgRenderScale);
      if (typeof r.setFlowSpeed === 'function') r.setFlowSpeed(bgFlowSpeed);
      // 静态模式：让每帧按静态帧处理（不推进流动相位）
      if (typeof r.setStaticMode === 'function') {
        r.setStaticMode(bgMode === 'still' || bgMode === 'off');
      }
      // 暂停/恢复：静态模式与 off 模式真停 rAF，最省电
      if (desiredPaused) {
        if (typeof r.pause === 'function') r.pause();
      } else {
        if (typeof r.resume === 'function') r.resume();
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  // 静态 / off 模式下周期性重申 pause：
  // 官方 window.amll.setPlaying(true) 内部会调 Fu.resume()，会把 pause 覆盖掉。
  // 1s 一次的代价可忽略，换来「用户选的静态背景不会被播放状态顶掉」。
  var enforceTimer = null;
  function startEnforce() {
    if (enforceTimer) return;
    enforceTimer = setInterval(function () {
      if (bgMode === 'still' || bgMode === 'off') {
        applyBackgroundCss();
        var r = getRenderer();
        if (r && typeof r.pause === 'function') {
          try { r.pause(); } catch (e) {}
        }
      }
    }, 1000);
  }

  // ==================================================================
  // 4. 歌词数据转换
  //
  //    Swift 侧下发的每一行已经是官方结构，只是时间戳单位是**毫秒**：
  //      { startTime: ms, endTime: ms,
  //        words: [ { word, startTime: ms, endTime: ms } ],
  //        translatedLyric, romanLyric, isBG, isDuet }
  //    官方 setLyrics 期望**秒**（内部再 *1000）。所以只做单位换算。
  // ==================================================================
  function convertLines(payload) {
    var lines = (payload && payload.lines) || [];
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i] || {};
      var startMs = Number(line.startTime) || 0;
      var endMs = Number(line.endTime) || (startMs + 5000);

      var srcWords = line.words || [];
      var words = [];
      if (srcWords.length) {
        for (var j = 0; j < srcWords.length; j++) {
          var w = srcWords[j] || {};
          words.push({
            word: String(w.word == null ? '' : w.word),
            startTime: (Number(w.startTime) || 0) / 1000,
            endTime: (Number(w.endTime) || 0) / 1000
          });
        }
      } else {
        words.push({ word: ' ', startTime: startMs / 1000, endTime: endMs / 1000 });
      }

      out.push({
        startTime: startMs / 1000,
        endTime: endMs / 1000,
        words: words,
        translatedLyric: line.translatedLyric || '',
        romanLyric: line.romanLyric || '',
        isBG: !!line.isBG,
        isDuet: !!line.isDuet
      });
    }
    return out;
  }

  // ==================================================================
  // 5. 时钟
  //
  //    官方 setTime(e, t)：t 为真时无条件落位；否则 `Math.abs(Ku-e) > .1`
  //    只在大偏差时改写。无损 / Hi-Res 下采样回调被拉长，几十到几百毫秒
  //    的残差落在这个阈值内且永不收敛 —— 所以本项目仍然需要一条
  //    **无条件硬校准**通道（hardCalibrate），这是相对官方页的关键增量。
  // ==================================================================
  var forceNextSeek = false;

  // ==================================================================
  // 6. AMLLBridge —— Swift 侧调用的入口
  // ==================================================================
  window.AMLLBridge = {

    /** 载入歌词并立刻定位到 ms 毫秒 */
    load: function (payload, ms) {
      var a = getAmll();
      if (!a) return false;
      try {
        // Swift 侧传的是**序列化后的 JSON 字符串**（见 payload(for:)），
        // 内容是数组。也允许直接传数组 / {lines:[…]}，方便调试。
        var raw = (typeof payload === 'string') ? JSON.parse(payload) : payload;
        var list = raw;
        if (raw && !Array.isArray(raw) && Array.isArray(raw.lines)) list = raw.lines;
        list = list || [];

        if (!list.length) {
          a.setLyrics([]);
          return true;
        }
        a.setLyrics(convertLines(list));
        forceNextSeek = true;
        a.setTime((Number(ms) || 0) / 1000, true);
        // 新歌进来时把流动背景的取色也刷新一遍
        if (currentAlbumImage) window.AMLLBridge.setAlbumImage(currentAlbumImage);
        return true;
      } catch (e) {
        return false;
      }
    },

    /** 周期时钟：对应官方 setTime(ms, isSeek) + setPlaying */
    sync: function (ms, running, rate) {
      var a = getAmll();
      if (!a) return;
      var seconds = (Number(ms) || 0) / 1000;
      if (forceNextSeek) {
        forceNextSeek = false;
        a.setTime(seconds, true);
      } else {
        a.setTime(seconds, false);
      }
      if (typeof running === 'boolean') {
        a.setPlaying(running);
        // setPlaying(true) 内部会 Fu.resume()，静态模式下要立刻拉回 pause
        if (desiredPaused) {
          var r = getRenderer();
          if (r && typeof r.pause === 'function') { try { r.pause(); } catch (e) {} }
        }
      }
    },

    /**
     * 硬校准：无视官方 0.1s 阈值，直接改写歌词播放器的时间基准。
     *
     * 这是本项目相对官方页的关键增量。官方 setTime 的阈值在无损 /
     * Hi-Res 文件上会留下几十到几百毫秒的残差且永不收敛，
     * 必须有一个无条件通道把它抹平。
     */
    hardCalibrate: function (ms) {
      var a = getAmll();
      if (!a) return;
      forceNextSeek = false;
      a.setTime((Number(ms) || 0) / 1000, true);
    },

    /** 设置专辑 id（官方取色通道，我们一般拿不到 AMLL 自己的 id） */
    setAlbum: function (albumId) {
      var a = getAmll();
      if (!a || albumId == null) return;
      currentAlbumId = String(albumId);
      try { a.setAlbum(currentAlbumId); } catch (e) { /* 失败会退回默认渐变 */ }
    },

    /**
     * 用封面图 URL 做背景取色（我们的主通道）。
     *
     * 官方 `setAlbum(id)` 会拿 id 去请求它自己的专辑接口，而我们手上
     * 只有播放器给的封面直链。这里把图片画到 16×16 离屏 canvas 取平均色，
     * **仅在官方渲染器没能铺满背景时**补一层径向渐变作为兜底 ——
     * 正常流动渲染工作时完全不干预，避免盖掉官方的观感。
     */
    setAlbumImage: function (url) {
      if (!url) return;
      currentAlbumImage = String(url);
      if (!bgEl()) return;

      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var size = 16; // 极小采样，取色不需要精度
          var canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          var data = ctx.getImageData(0, 0, size, size).data;
          var r = 0, g = 0, b = 0, n = 0;
          for (var i = 0; i < data.length; i += 4) {
            r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
          }
          if (!n) return;
          r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
          window.__wmAlbumAverage = [r, g, b];

          var el = bgEl();
          if (el && !el.querySelector('canvas')) {
            el.style.background =
              'radial-gradient(120% 100% at 20% 15%, rgba(' + r + ',' + g + ',' + b + ',.85) 0%, ' +
              'rgba(' + Math.round(r * .55) + ',' + Math.round(g * .55) + ',' + Math.round(b * .55) + ',.9) 45%, ' +
              'rgba(0,0,0,.96) 100%)';
          }
        } catch (e) { /* canvas 被污染或无权限，忽略 */ }
      };
      img.onerror = function () { /* 图片失败时保留默认渐变 */ };
      img.src = currentAlbumImage;
    },

    /** 歌词字体样式（大小 / 非活动行大小 / 字重 / 行距 / 字体族） */
    setFontStyle: function (size, inactive, weight, margin, family) {
      var a = getAmll();
      if (!a) return;
      try {
        a.setFontStyle(Number(size) || 30, Number(inactive) || 20,
                       Number(weight) || 600, Number(margin) || 16, family || '');
      } catch (e) { /* 字体设置失败不影响主流程 */ }
    },

    /** 兼容旧接口名 */
    setFontSize: function (size) {
      window.AMLLBridge.setFontStyle(size, Math.max(12, Math.round(size * 0.7)), 600, 16, '');
    },

    /**
     * 背景模式。
     *   blurOnly —— 流动背景 + 高斯模糊（默认，兼顾观感与性能）
     *   flowing  —— 官方流动背景，不加模糊，全速渲染
     *   still    —— 静态背景：暂停流动 + 隐藏 #bg，最省电（歌词照常）
     *   off      —— 完全不要背景层，交给 SwiftUI 底图
     */
    setBackgroundMode: function (mode) {
      var m = String(mode || 'blurOnly');
      bgMode = m;

      if (m === 'off' || m === 'still') {
        bgHidden = true;
        bgBlur = 0;
        bgOpacity = 0;
        desiredPaused = true;
      } else if (m === 'flowing') {
        bgHidden = false;
        bgBlur = 0;
        bgSaturate = 1;
        bgOpacity = 1;
        desiredPaused = false;
      } else { // blurOnly
        bgHidden = false;
        bgBlur = 28;
        bgSaturate = 1.05;
        bgOpacity = 0.72;
        desiredPaused = false;
      }

      applyBackgroundCss();
      applyRendererTuning();
      startEnforce();
      return true;
    },

    /** 背景高斯模糊半径（px） */
    setBlur: function (radius) {
      bgBlur = Math.max(0, Number(radius) || 0);
      applyBackgroundCss();
    },

    /** 背景层不透明度 */
    setBackgroundOpacity: function (opacity) {
      bgOpacity = Math.min(Math.max(Number(opacity) || 0, 0), 1);
      applyBackgroundCss();
    },

    /**
     * 背景渲染帧率（真实生效）。
     *
     * 官方没把 setFPS 暴露到 window.amll，但注入层通过 bind hook
     * 拿到了渲染器实例，这里直接调用，档位切换立刻反映到 GPU 占用上。
     */
    setBackgroundFPS: function (fps) {
      bgFps = Math.max(10, Math.min(Number(fps) || 40, 60));
      return applyRendererTuning();
    },

    /**
     * 背景渲染分辨率倍率（真实生效）。
     *
     * 这是**省电的主力**：0.4 倍相比 1.0 倍，片元着色器要处理的像素
     * 少了 6 倍以上，而背景本身还要再过一层高斯模糊，
     * 分辨率越高模糊越贵 —— 所以低档位在模糊模式下的收益尤其明显。
     */
    setBackgroundRenderScale: function (scale) {
      bgRenderScale = Math.min(Math.max(Number(scale) || 0.5, 0.25), 1);
      return applyRendererTuning();
    },

    /** 流动速度（0 基本不动） */
    setBackgroundFlowSpeed: function (speed) {
      bgFlowSpeed = Math.max(0, Number(speed) || 0.3);
      return applyRendererTuning();
    },

    /** 歌词相对位置（0 顶部 / 0.5 居中 / 1 底部） */
    setAlignPosition: function (ratio) {
      var a = getAmll();
      if (!a) return;
      try { a.setAlignPosition(Math.max(0, Math.min(1, Number(ratio) || 0.5))); } catch (e) {}
    },

    /** 弹簧动画开关：官方页默认已开启，这里保留接口兼容 */
    setSpring: function (enabled) {
      window.__wmSpringEnabled = !!enabled;
    },

    /** 供 Swift 侧查询背景层是否已就绪 */
    backgroundReady: function () {
      return !!bgEl();
    }
  };

  // ==================================================================
  // 7. 页面就绪后补齐状态 + 上报渲染器是否截获成功
  // ==================================================================
  window.addEventListener('load', function () {
    setTimeout(function () {
      applyBackgroundCss();
      applyRendererTuning();
      startEnforce();
      try {
        window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.amll &&
          window.webkit.messageHandlers.amll.postMessage({
            name: 'bgTuning',
            data: { gotRenderer: !!getRenderer(), fps: bgFps, scale: bgRenderScale }
          });
      } catch (e) {}
    }, 200);
  });
})();
</script>

</body>
</html>
