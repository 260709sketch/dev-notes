name: WellMusicSwiftUI
options:
  bundleIdPrefix: com.wellmusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # ★ 2026-10-14 用户：搜索框右侧的「取消」按钮显示英文 "Cancel"，要改成中文。
  #   根因：工程原先**完全没有本地化声明**（无 *.lproj、无 developmentRegion），
  #   系统控件（UISearchBar 的取消按钮、系统弹窗按钮等）只能回退到英文。
  #   修法：声明开发语言为 zh-Hans，并在 Info.plist 里列出受支持的语言
  #   （CFBundleLocalizations）——有了它，UIKit 就会按中文渲染自带文案，
  #   不需要真的建 zh-Hans.lproj 资源目录。
  developmentLanguage: zh-Hans
# libmpv 播放内核（MPVKit = libmpv + FFmpeg 预编译 xcframework，LGPL）
# 2026-10-13 迁移：无白边底版 + 仅迁移「播放器 / MPV 内核 / LX 音源系统」
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2
targets:
  WellMusicSwiftUI:
    type: application
    platform: iOS
    sources:
      - WellMusicSwiftUI
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: WellMusicSwiftUI/Supporting/Info.plist
      properties:
        CFBundleDisplayName: WellMusic
        # ★ 2026-10-14：让系统自带控件文案走中文（搜索框「取消」等）
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        OTHER_LDFLAGS:
          - $(inherited)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  WellMusicSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WellMusicSwiftUITests
    dependencies:
      - target: WellMusicSwiftUI
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app.tests
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  WellMusicSwiftUI:
    build:
      targets:
        WellMusicSwiftUI: all
        WellMusicSwiftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WellMusicSwiftUITests