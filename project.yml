name: WellMusicSwiftUI
options:
  bundleIdPrefix: com.wellmusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # ★ 2026-10-14 用户：搜索框右侧的「取消」按钮显示英文 "Cancel"，要改成中文。
  #   根因：工程原先**完全没有本地化声明**（无 *.lproj、无 developmentRegion），
  #   系统控件（UISearchBar 的取消按钮、系统弹窗按钮等）只能回退到英文。
  #   修法：声明开发语言为 zh-Hans，并在 Info.plist 里列出受支持的语言
  #   （CFBundleLocalizations）——有了它，UIKit 就会按中文渲染自带文案，
  #   不需要真的建 zh-Hans.lproj 资源目录。
  developmentLanguage: zh-Hans
# libmpv 播放内核（MPVKit = libmpv + FFmpeg 预编译 xcframework，LGPL）
# 2026-10-13 迁移：无白边底版 + 仅迁移「播放器 / MPV 内核 / LX 音源系统」
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2
targets:
  WellMusicSwiftUI:
    type: application
    platform: iOS
    sources:
      # ⚠️ 2026-10-16：原生 Apple Music 播放器移植批次（Player/NativeAM）暂挂出编译，
      #   待 shim（PlayerStore/AppSettings 适配层）完成后回归。删除本 excludes 即启用。
      - WellMusicSwiftUI
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: WellMusicSwiftUI/Supporting/Info.plist
      properties:
        CFBundleDisplayName: WellMusic
        # ★ 2026-10-14：让系统自带控件文案走中文（搜索框「取消」等）
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # ⚠️ 声明横屏仅为「MV 播放页」服务：App 全局由 WellMusicAppDelegate
        #   的方向锁保持竖屏，只有 MV 页临时放开横屏（2026-10-15 用户）。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # ★ 2026-10-15：解锁 ProMotion 高刷（iPhone 上最高 120Hz）。
        #
        # Apple 官方文档原文：「If you don't enable this support, Core Animation
        # won't access higher frame rates (above 60Hz).」
        # 也就是说：**不加这个键，即使在 120Hz 机型上，SwiftUI 动画、拖拽跟手、
        # 滚动与 WebView 内的渲染也全部被钉在 60Hz** —— 这正是「别人很顺、
        # 我们发涩」的直接原因。
        # 加上之后系统会自动为 SwiftUI / UIKit / CAAnimation 处理好帧率调度，
        # 无需自己再挂 CADisplayLink；低电量模式下系统仍会自动退回 60Hz。
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # ★ 2026-10-16 用户问题16：设置 → 关于页的「版本」只显示 1.0.0。
        #   原先工程里没有声明 MARKETING_VERSION，xcodebuild 默认给 "1.0"。
        #   显式声明后 Info.plist 里的 $(MARKETING_VERSION) 就有真值，
        #   关于页从 Bundle 读出来即是 1.0.0（版本号只有这一个来源，不再手写）。
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS:
          - $(inherited)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      configs:
        # ★ 2026-10-16：Debug 改为全量编译（wholemodule）。
        #
        # 原因：CI 的 Debug 默认是 batch mode，swiftc 在**批内逐文件**编译并
        # 「遇到第一个出错的主文件就停」，于是每次构建只能暴露一个文件的错误 ——
        # 一轮 3 分钟，几十个文件要烧几十轮。
        # wholemodule 下整个模块一次性类型检查，**所有**编译错误一次报全；
        # Release（真正出 IPA 的那条）本来就默认 wholemodule，不受影响。
        Debug:
          SWIFT_COMPILATION_MODE: wholemodule
  WellMusicSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WellMusicSwiftUITests
    dependencies:
      - target: WellMusicSwiftUI
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
schemes:
  WellMusicSwiftUI:
    build:
      targets:
        WellMusicSwiftUI: all
        WellMusicSwiftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WellMusicSwiftUITests