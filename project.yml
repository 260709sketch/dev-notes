name: WellMusicSwiftUI
options:
  bundleIdPrefix: com.wellmusic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
# libmpv 播放内核（MPVKit = libmpv + FFmpeg 预编译 xcframework，LGPL）
# 选 1.1.0-n9.0.2：与 main 分支 Package.swift 引用的二进制版本一致。
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2
targets:
  WellMusicSwiftUI:
    type: application
    platform: iOS
    sources:
      # 整目录 glob：目录下任何非源码文件都会被打成资源。
      # `Resources/AMLLLyrics.html` 是生成 `AMLLLyricsPage.html` 的**官方原始副本**
      # （见 build_amll_page.py），运行时只会加载注入后的 Page 版本，
      # 把它排除掉可以省下约 456 KB 的包体。
      - path: WellMusicSwiftUI
        excludes:
          - "Resources/AMLLLyrics.html"
    dependencies:
      - package: MPVKit
        product: MPVKit
    sources:
      # 整目录 glob：目录下任何非源码文件都会被打成资源。
      # `Resources/AMLLLyrics.html` 是生成 `AMLLLyricsPage.html` 的**官方原始副本**
      # （见 build_amll_page.py），运行时只会加载注入后的 Page 版本，
      # 把它排除掉可以省下约 456 KB 的包体。
      - path: WellMusicSwiftUI
        excludes:
          - "Resources/AMLLLyrics.html"
    info:
      path: WellMusicSwiftUI/Supporting/Info.plist
      properties:
        CFBundleDisplayName: WellMusic
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        OTHER_LDFLAGS:
          - $(inherited)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  WellMusicSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WellMusicSwiftUITests
    dependencies:
      - target: WellMusicSwiftUI
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.wellmusic.app.tests
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
schemes:
  WellMusicSwiftUI:
    build:
      targets:
        WellMusicSwiftUI: all
        WellMusicSwiftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WellMusicSwiftUITests