name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 1) 单元测试：验证播放器移植的常量/几何/派生逻辑（各平台映射含音质档位）
      - name: Run unit tests
        run: |
          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO \
            test

      # 2) 模拟器 Release 构建：验证代码可编译
      - name: Build (Simulator, Release)
        run: |
          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 3) 真机构建（无签名）：产出 .app → 打包 ipa 供签名
      - name: Build (Device, Release, unsigned)
        run: |
          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/device/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry WellMusicSwiftUI-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WellMusicSwiftUI-${{ github.sha }}
          path: |
            build/ipa/WellMusicSwiftUI-unsigned.ipa
            build/sim/Build/Products/*/WellMusicSwiftUI.app
          if-no-files-found: error