name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 0) SPM 预解析（带重试）：MPVKit 的 binary targets 从 GitHub Releases 下载
      #    （Libmpv/Libavcodec/Libssl 等数百 MB），偶发 504/超时会让整个 run 挂掉。
      #    先单独解析并重试 —— SPM 的下载缓存跨 DerivedData 共享，后续构建直接复用。
      - name: Resolve SPM packages (with retry)
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            echo "== resolve 尝试 $i =="
            xcodebuild -project WellMusicSwiftUI.xcodeproj -scheme WellMusicSwiftUI \
              -resolvePackageDependencies && { echo "== resolve 成功 =="; break; }
            if [ "$i" = "5" ]; then echo "== 5 次均失败 =="; exit 1; fi
            sleep 20
          done

      # 1) 单元测试：验证播放器移植的常量/几何/派生逻辑（各平台映射含音质档位）
      #    注意：macos-26 runner 上模拟器机型随 Xcode 版本变化（当前无 iPhone 16，只有 16e/17 系），
      #    因此不硬编码机型名，改为自动挑第一个可用的 iPhone 模拟器（优先 16 系）。
      - name: Run unit tests
        run: |
          set -euo pipefail
          echo "== 可用模拟器 =="
          xcrun simctl list devices available | grep -i iphone || true

          echo '' | base64 -d > /tmp/pick_sim.py
          echo "== pick_sim.py =="
          cat /tmp/pick_sim.py

          DEST=$(xcrun simctl list devices available --json | python3 /tmp/pick_sim.py)
          echo "== 选中模拟器 udid: $DEST =="
          test -n "$DEST"

          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath build/tests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/build-test.log

      # 兜底：无论成败，都把编译日志存成 artifact，方便排查（日志 blob 偶尔拿不到）
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: /tmp/build-test.log
          if-no-files-found: ignore


      # 2) 模拟器 Release 构建：验证代码可编译
      - name: Build (Simulator, Release)
        run: |
          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      # 3) 真机构建（无签名）：产出 .app → 打包 ipa 供签名
      - name: Build (Device, Release, unsigned)
        run: |
          xcodebuild \
            -project WellMusicSwiftUI.xcodeproj \
            -scheme WellMusicSwiftUI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/device/Build/Products -name '*.app' -maxdepth 2 | head -1)
          echo "APP_PATH=$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry WellMusicSwiftUI-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WellMusicSwiftUI-${{ github.sha }}
          path: |
            build/ipa/WellMusicSwiftUI-unsigned.ipa
            build/sim/Build/Products/*/WellMusicSwiftUI.app
          if-no-files-found: error